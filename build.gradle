plugins { id 'java' }
repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex("net\\.runelite.*") } }
    mavenCentral()
}
def runeLiteVersion = 'latest.release'
def pluginMainClass = 'nl.dutchnations.events.DutchNationsPluginTest'
dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(11) }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea', '-Ddutch.nations.dropTest=true'
    args '--developer-mode'
}
tasks.register('runDropTestLocal', JavaExec) {
    group = 'application'
    description = 'Run the plugin against the isolated local drop-test API.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea', '-Ddutch.nations.local=true'
    args '--developer-mode'
}
tasks.register('runDropTestOnline', JavaExec) {
    group = 'application'
    description = 'Run the local plugin against the online server for the owner screenshot test.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea', '-Ddutch.nations.dropTest=true'
    args '--developer-mode'
}

tasks.register('runLocal', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea'
    systemProperty 'dutch.nations.local', 'true'
    args '--developer-mode'
}