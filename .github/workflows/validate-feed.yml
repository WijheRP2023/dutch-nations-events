name: Validate Dutch Nations feed

on:
  push:
    paths:
      - feed.json
      - src/**
      - build.gradle
  pull_request:
    paths:
      - feed.json
      - src/**
      - build.gradle

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
