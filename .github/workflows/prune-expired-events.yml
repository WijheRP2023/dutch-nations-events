name: Remove expired events

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dutch-nations-feed-maintenance
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove expired events
        run: python scripts/prune_expired_events.py
      - name: Validate feed
        uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew test --no-daemon
      - name: Commit updated feed
        run: |
          if git diff --quiet -- feed.json; then
            echo "No expired events to commit"
            exit 0
          fi
          git config user.name "dutch-nations-bot"
          git config user.email "dutch-nations-bot@users.noreply.github.com"
          git add feed.json
          git commit -m "Remove expired clan events"
          git push
